name: Release

# 三平台安装包 → GitHub Release。
#
# 为什么必须用 CI：
#   Tauri **不支持交叉编译**。macOS 的 .app/.dmg 要在 macOS 上打（Xcode 命令行工具 +
#   macOS SDK），Linux 的 .AppImage/.deb/.rpm 要在 Linux 上打（需要 webkit2gtk 等系统库）。
#   在 Windows 上产不出这两个平台的可用包 —— 这是平台限制，不是配置问题。
#
# 触发方式：
#   - 推一个 `v*` 标签 → 构建 + 发布到 Release
#   - 手动 workflow_dispatch → 只构建，产物挂在 Actions 的 Artifacts 里（不发布）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同一分支/标签同时只跑一个发布，避免两个任务抢着建同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 创建/更新 Release 需要写权限；不写这一条 GITHUB_TOKEN 只能读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 标签和 package.json 的版本必须一致，否则 Release 标题、安装包文件名、
  # 应用内显示的版本会三处不一致（以前就出现过状态栏写着 0.1.0、实际 0.3.0 的事）。
  guard:
    name: 校验版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 标签必须等于 package.json 的 version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version package.json)"
          echo "标签: $tag    版本: $ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 的版本 $ver 不一致。请先改版本号再打标签。"
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 当前只发 Windows ──────────────────────────────────────────────
          # 首个版本先只出 Windows：这一路是唯一在本机反复验证过的，
          # 发布出去不会踩到平台特有的打包问题。macOS / Linux 的条目留在下面，
          # 把注释放开就能一起出（那时 Release 会同时挂上七种安装包）。
          - os: windows-latest
            label: windows-x64
            args: ""

          # ── 待启用：macOS（Apple Silicon + Intel）─────────────────────────
          # Apple Silicon 与 Intel 各出一份：Tauri 的 macOS 产物带架构后缀，
          # 用户按自己的机器选，不用管 Rosetta。
          # - os: macos-latest
          #   label: macos-arm64
          #   args: "--target aarch64-apple-darwin"
          # - os: macos-latest
          #   label: macos-x64
          #   args: "--target x86_64-apple-darwin"

          # ── 待启用：Linux ────────────────────────────────────────────────
          # 用 22.04 而不是 ubuntu-latest：AppImage 里的 glibc 符号要向旧的看齐，
          # 在 24.04 上打出来的包在旧发行版上会报 GLIBC_2.39 not found。
          # - os: ubuntu-22.04
          #   label: linux-x64
          #   args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两个目标都要装：哪怕只打其中一个，tauri 也可能按需查另一个
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查 + 前端测试
        run: |
          npm run typecheck
          npm test

      - name: 后端测试
        run: npm run rust:test

      - name: 打包
        run: npx tauri build ${{ matrix.args }}

      - name: 收集安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          if-no-files-found: error
          # 各平台只产出自己那几种；用通配，缺的不会报错
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # 单独一个 job 统一发布：三个平台的产物都在手上了才发，
  # 避免矩阵里几个 job 同时去建同一个 Release（会撞车）。
  release:
    name: 发布到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 需要 CHANGELOG.md 与 scripts/release-notes.mjs 来生成发布说明
      - uses: actions/checkout@v4

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: raw
          # 把多个 artifact 合并到同一棵树里
          merge-multiple: true

      # upload-artifact 会**保留相对路径**：几个 glob 分别命中 nsis/ 与 msi/ 时，
      # 它取公共根目录，artifact 内部就是 `nsis/xxx.exe`、`msi/xxx.msi`。
      # 下载下来因此是嵌套目录，直接 `sha256sum *` 会撞上 "Is a directory" 而失败
      # （第一次跑发布就是死在这一步）。这里先摊平，后面的校验和与上传都只面对平铺文件。
      - name: 摊平目录
        run: |
          mkdir -p artifacts
          find raw -type f -exec cp -v {} artifacts/ \;
          echo "---- artifacts ----"
          find artifacts -maxdepth 1 -type f -printf '%10s  %f\n' | sort -k2

      # 发布说明取自 CHANGELOG 对应版本那一段，而不是让 GitHub 堆一串 commit 标题
      - name: 生成发布说明
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          echo "---- notes.md ----"
          head -15 notes.md

      # 未签名的安装包，用户没法靠"发布者"判断完整性 —— 给一份校验和，
      # 至少能确认下载没被中间环节改过。
      - name: 生成校验和
        run: |
          cd artifacts
          # 只取本层普通文件（排除刚生成的校验和自身），且不依赖 glob 展开：
          # 目录、隐藏文件都不会让它报错。
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | while IFS= read -r f; do sha256sum "$f"; done > /tmp/sums.txt
          mv /tmp/sums.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: Inkdown ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          # 首次发布想先自己看一眼，把这里改成 true，之后在网页上点「Publish」
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
