<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="本地图片加载示例">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c9aff" />
      <stop offset="100%" stop-color="#4ec9a5" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="518" height="118" rx="12" fill="none" stroke="url(#g)" stroke-width="2" />
  <text x="24" y="48" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#4c9aff">
    本地图片按文档目录解析
  </text>
  <text x="24" y="80" font-family="Consolas, monospace" font-size="14" fill="#8d949d">
    http://asset.localhost/&lt;encoded-abs-path&gt;
  </text>
  <text x="24" y="104" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#8d949d">
    能显示这张图，说明 asset 协议与 CSP 配置都正确。
  </text>
</svg>
